function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tagHtml(t){ if(t==='food')return '<span class="tag t-food">吃</span>'; if(t==='book')return '<span class="tag t-book">要先訂</span>'; if(t==='view')return '<span class="tag t-view">觀景</span>'; return ''; }
function infoFor(name){ return INFO.find(o=> name.indexOf(o.m)>=0); }
function enrichFor(n,name){ return (ENRICH[n]||{})[name]; }
function gmapSpotLink(it){ return it.ll?'https://www.google.com/maps/search/?api=1&query='+it.ll[0]+','+it.ll[1]:null; }
function gmapDayLink(day,order){ const seq=(order||day.items.map((it,i)=>i)).filter(i=>day.items[i]&&day.items[i].ll); const cs=seq.map(i=>day.items[i].ll[0]+','+day.items[i].ll[1]); return cs.length?('https://www.google.com/maps/dir/'+cs.join('/')):null; }
function dist(a,b){ const dx=a[0]-b[0], dy=(a[1]-b[1])*Math.cos(a[0]*Math.PI/180); return Math.hypot(dx,dy); }
function dayPoints(day){ const a=[]; day.items.forEach((it,i)=>{ if(it.ll) a.push({i:i, ll:it.ll}); }); return a; }
function perms(arr){ if(arr.length<=1) return [arr]; const o=[]; arr.forEach((v,i)=>{ perms(arr.slice(0,i).concat(arr.slice(i+1))).forEach(p=>o.push([v,...p])); }); return o; }
function optimOrder(day){
  const pts=dayPoints(day); if(pts.length<=2) return pts.map(p=>p.i);
  const start=pts[0], rest=pts.slice(1); let best=rest, bestLen=Infinity;
  if(rest.length<=6){ perms(rest).forEach(seq=>{ let len=0, prev=start.ll; seq.forEach(p=>{ len+=dist(prev,p.ll); prev=p.ll; }); if(len<bestLen){bestLen=len; best=seq;} }); }
  else { let rem=rest.slice(), prev=start.ll, seq=[]; while(rem.length){ let bi=0,bd=Infinity; rem.forEach((p,i)=>{const d=dist(prev,p.ll); if(d<bd){bd=d;bi=i;}}); seq.push(rem[bi]); prev=rem[bi].ll; rem.splice(bi,1);} best=seq; }
  return [start.i, ...best.map(p=>p.i)];
}
function displayOrder(day){
  if(!optDays[day.n]) return day.items.map((it,i)=>i);
  const opt=optimOrder(day); const nonLL=day.items.map((it,i)=>i).filter(i=>!day.items[i].ll);
  return opt.concat(nonLL);
}
function buildMap(day,order,numberOf){
  const m=MAPS[day.n]; if(!m) return '<div style="text-align:center;color:#99a;font-size:12px;padding:16px">這天沒有地圖點</div>';
  const pos={}; m.pts.forEach(p=>pos[p.idx]={x:p.x,y:p.y});
  const seq=order.filter(i=>day.items[i]&&day.items[i].ll&&pos[i]!==undefined);
  const route=seq.map(i=>pos[i].x.toFixed(0)+','+pos[i].y.toFixed(0)).join(' ');
  let s='<div class="mapbox"><img src="'+m.img+'" alt="map">';
  s+='<svg viewBox="0 0 '+m.w+' '+m.h+'" preserveAspectRatio="none">';
  if(seq.length>1) s+='<polyline points="'+route+'" fill="none" stroke="#e35b8b" stroke-width="3" stroke-dasharray="7 5" opacity=".95"/>';
  seq.forEach(i=>{ const p=pos[i], col=done['d'+day.n+'_'+i]?'#b0b7c6':'#e35b8b';
    s+='<circle cx="'+p.x.toFixed(0)+'" cy="'+p.y.toFixed(0)+'" r="15" fill="'+col+'" stroke="#fff" stroke-width="2.5"/>';
    s+='<text x="'+p.x.toFixed(0)+'" y="'+(p.y+6).toFixed(0)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">'+numberOf[i]+'</text>'; });
  s+='</svg></div>'; return s;
}

}
function addFormHTML(n){
  return '<div class="additem"><div class="addtoggle" onclick="showAdd('+n+')">＋ 自己加一個點</div><div class="addform" id="addform-'+n+'" style="display:none"><input id="ai-name-'+n+'" placeholder="地點名稱（必填）"><input id="ai-note-'+n+'" placeholder="備註（可不填，例：想吃的、要買的）"><input id="ai-ll-'+n+'" placeholder="座標（可不填，例 35.68,139.70）"><div class="addbtns"><button onclick="addUserItem('+n+')">加進去</button><button class="ghost" onclick="hideAdd('+n+')">取消</button></div></div></div>';
}
function renderDay(){
  const day=DAYS[cur], order=displayOrder(day), numberOf={};
  order.forEach((oi,pos)=>numberOf[oi]=pos+1);
  const dl=gmapDayLink(day,order);
  const tr=TRANSIT.perDay.find(p=>p.day===day.n);
  let h='<div class="dayhead"><div class="d-area">'+day.area+'</div><div class="d-meta">Day '+day.n+'・'+day.date+'（'+day.dow+'）</div>';
  if(tr) h+='<div class="d-transit">🚃 '+tr.how+'</div>';
  h+='</div>';
  h+='<div class="mapwrap"><div class="maptitle"><span>📍 當天路線（號碼＝順序）</span><button class="minibtn" onclick="toggleOpt('+day.n+')">'+(optDays[day.n]?'↩︎ 原順序':'🧭 排最短')+'</button></div>'+buildMap(day,order,numberOf)+'</div>';
  if(dl) h+='<a class="gmap" href="'+dl+'" target="_blank" rel="noopener">🗺️ 用 Google 地圖導航這天</a>';
  h+='<div class="list">';
  order.forEach(oi=> h+=itemHTML(day.n,oi,day.items[oi],numberOf[oi]));
  (userItems[day.n]||[]).forEach((u,ui)=> h+=userItemHTML(day.n,ui,u,order.length+ui+1));
  h+=addFormHTML(day.n)+'</div>';
  contentEl.innerHTML=h;
}
function renderExtras(){
  let h='<div class="sec"><div class="secintro">Vero 精選的下午茶/餐廳/買物短清單，點名字可查地圖。想更完整看「💡候選」分頁。</div>';
  EXTRAS.forEach(sec=>{ h+='<div class="exhead">'+sec.h+'</div><div class="excard">';
    sec.rows.forEach(r=>{ const q=encodeURIComponent(r[0]+' 東京'); h+='<div class="exrow"><b><a class="name" style="border:none;color:#c2456f" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+r[0]+'</a></b><span class="where">'+r[1]+'</span><span class="why">'+r[2]+'</span></div>'; });
    h+='</div>'; });
  h+='</div>'; contentEl.innerHTML=h;
}
function renderHotels(){
  let h='<div class="sec"><div class="secintro">3人・住新宿・12晚（2027/1/22–2/3）。一月是淡季但三人房搶手，越早訂越省。點名字可查地圖。價格為淡季粗估、以訂房網當下為準。</div>';
  if(HOTELS.pick) h+='<div class="pick">⭐ 最平衡推薦：'+HOTELS.pick+'</div>';
  HOTELS.hotels.forEach(o=>{ const q=encodeURIComponent(o.name+' 東京');
    h+='<div class="hotel"><h4><a class="cname" style="text-decoration:none;color:inherit;border-bottom:1px dashed #d5b3c1" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+o.name+'</a></h4><div class="hmeta">📍 '+o.area+'｜🚶 '+o.walk+'</div><div class="hprice">💰 '+o.price+'</div><div class="hrow"><b>房型</b>：'+o.room+'<br><b>優點</b>：'+o.pros+'<br><b>缺點</b>：'+o.cons+'<br><b>適合</b>：'+o.good_for+'</div></div>'; });
  if(HOTELS.note) h+='<div class="pick" style="background:#eef4fc;border-color:#d9e6f6;color:#3f6ea8">📌 '+HOTELS.note+'</div>';
  h+='</div>'; contentEl.innerHTML=h;
}
function renderTransit(){
  let h='<div class="sec"><div class="secintro">你們沒車、全靠電車地鐵。下面是票卡、機場往返、跟每天怎麼從新宿出發。</div>';
  h+='<div class="cgroup">🎫 票卡怎麼買</div>';
  TRANSIT.cards.forEach(c=>{ h+='<div class="tcard"><h4>'+c.name+'</h4><div class="tp"><b>'+c.price+'</b><br>'+c.advice+'</div></div>'; });
  h+='<div class="cgroup">✈️ 機場 → 新宿</div><div class="excard" style="padding:2px 14px">';
  TRANSIT.airport.forEach(a=>{ h+='<div class="troute"><span class="tr-l">'+a.route+'</span><span class="tr-r">'+a.time+'<br>'+a.cost+'</span></div>'; });
  h+='</div><div class="cgroup">🚉 每天怎麼搭（從新宿）</div><div class="excard" style="padding:2px 14px">';
  TRANSIT.perDay.forEach(p=>{ h+='<div class="troute"><span class="tr-l"><b>D'+p.day+'　'+p.area+'</b><br>'+p.how+'</span></div>'; });
  h+='</div><div class="cgroup">💡 小撇步</div><ul class="tiplist">';
  TRANSIT.tips.forEach(t=>{ h+='<li>'+t+'</li>'; });
  h+='</ul></div>'; contentEl.innerHTML=h;
}
function renderCands(){
  const groups=[['see','👀 想看／想去'],['buy','🛍 想買／挖寶'],['eat','🍰 想吃／喝']];
  let h='<div class="sec"><div class="secintro">網路上很多人推、但目前不在行程裡的加碼清單，每個都標了「適合排哪天」。想去就去那天用「＋自己加一個點」加進去。點名字可查地圖。</div>';
  groups.forEach(g=>{ const arr=CANDS[g[0]]||[]; h+='<div class="cgroup">'+g[1]+'</div>';
    arr.forEach(c=>{ const q=encodeURIComponent(c.name+' 東京');
      h+='<div class="citem"><a class="cname" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+c.name+'</a><div class="cintro">'+c.intro+'</div><div class="cfit"><span class="carea">📍 '+c.area+'</span>　🗓 '+c.fit+'</div></div>'; });
  });
  h+='</div>'; contentEl.innerHTML=h;
}
function toggle(id){ done[id]=!done[id]; save(KEY,done); renderDay(); }
function toggleOpt(n){ optDays[n]=!optDays[n]; save(OKEY,optDays); renderDay(); }
function addUserItem(n){
  const name=(document.getElementById('ai-name-'+n).value||'').trim();
  if(!name){ alert('幫這個點取個名字吧 🙂'); return; }
  const note=(document.getElementById('ai-note-'+n).value||'').trim();
  const llraw=(document.getElementById('ai-ll-'+n).value||'').trim();
  let ll=null; const mm=llraw.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/); if(mm) ll=[parseFloat(mm[1]),parseFloat(mm[2])];
  if(!userItems[n]) userItems[n]=[]; userItems[n].push({t:name,d:note,ll:ll,done:false});
  save(UKEY,userItems); renderDay();
}
function toggleUser(n,ui){ userItems[n][ui].done=!userItems[n][ui].done; save(UKEY,userItems); renderDay(); }
function delUser(n,ui){ userItems[n].splice(ui,1); save(UKEY,userItems); renderDay(); }
function showAdd(n){ const f=document.getElementById('addform-'+n); if(f) f.style.display='block'; }
function hideAdd(n){ const f=document.getElementById('addform-'+n); if(f) f.style.display='none'; }
function select(i){
  tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.i==i));
  if(i==='tr'){ renderTransit(); } else if(i==='ho'){ renderHotels(); } else if(i==='ex'){ renderExtras(); } else if(i==='cd'){ renderCands(); }
  else { cur=parseInt(i,10); renderDay(); }
  window.scrollTo({top:0,behavior:'smooth'});
}
let th=''; DAYS.forEach((d,i)=>{ th+='<div class="tab" data-i="'+i+'"><b>D'+d.n+'</b>'+d.date+'</div>'; });
th+='<div class="tab" data-i="tr"><b>🚃</b>交通</div>';
th+='<div class="tab" data-i="ho"><b>🏨</b>住宿</div>';
th+='<div class="tab" data-i="ex"><b>★</b>特別店</div>';
th+='<div class="tab" data-i="cd"><b>💡</b>候選</div>';
tabsEl.innerHTML=th;
tabsEl.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>select(t.dataset.i); });
select(0);
</script>
</body>
</html>
