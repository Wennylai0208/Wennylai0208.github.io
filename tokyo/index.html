<head>

<title>東京 15 日行程 v7</title>
<style>
  :root{ --bg:#f4f6fb; --card:#ffffff; --ink:#242a38; --sub:#6f7890; --accent:#e35b8b; --gold:#b07d0a; --line:#e7ebf3; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; line-height:1.55;}
  header{padding:20px 16px 12px; background:linear-gradient(160deg,#ffe1ec,#fff2e4); position:relative;}
  h1{margin:0; font-size:19px; color:#3a2230;}

  .ver{display:inline-block;background:#c2456f;color:#fff;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:9px;margin-top:7px;letter-spacing:.3px;}
  .menubtn{position:absolute;top:15px;right:14px;background:rgba(255,255,255,.8);border:1px solid #f0cdd9;color:#c2456f;font-size:18px;width:40px;height:34px;border-radius:10px;cursor:pointer;line-height:1;}
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 14px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; min-width:56px; text-align:center; padding:7px 10px; border-radius:12px; background:#f0f2f8; color:var(--sub); font-size:12px; cursor:pointer; border:1px solid #e7ebf3; line-height:1.25;}
  .tab b{display:block; font-size:14px; color:var(--ink);}
  .tab.active{background:linear-gradient(160deg,#ff7a9c,#ffab6b); color:#3a1522; border-color:#ffab6b;}
  .tab.active b{color:#3a1522;}
  .dayhead{padding:16px 16px 4px;}
  .d-area{font-size:19px; font-weight:700;}
  .d-meta{font-size:12.5px; color:var(--gold); margin-top:2px;}
  .d-hotel{font-size:12px;color:#a15a2a;margin-top:9px;background:#fff3e9;border:1px solid #f2d8c4;border-radius:9px;padding:6px 9px;display:inline-block;}
  .daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .chip{font-size:11px;padding:3px 9px;border-radius:9px;background:#eef1f8;color:#5c667e;border:1px solid #e2e7f2;line-height:1.5;}
  .chip.pe{background:#e8f7ee;color:#1f7a45;border-color:#c6ead4;}
  .chip.pm{background:#fff4e0;color:#9a6a10;border-color:#f2dfb8;}
  .chip.ph{background:#ffe9e9;color:#b03b3b;border-color:#f3cdcd;}
  .chip.bk{background:#fff1cf;color:#a9780a;border-color:#f0dca8;font-weight:700;}
  .flexbar{margin:11px 14px 0;background:#eaf8ef;border:1px solid #cbe8d7;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#256b43;line-height:1.6;}
  .daynote{margin:11px 14px 0;background:#f8f5ff;border:1px solid #ded7f2;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#4a3f78;line-height:1.75;}
  .daynote b{color:#3a2d6b;}
  .mapwrap{margin:12px 14px 4px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 10px 6px;}
  .maptitle{font-size:11px; color:var(--sub); margin:0 4px 4px; display:flex; justify-content:space-between; align-items:center;}
  .mapbox{position:relative;width:100%;border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--line);}
  .mapbox img{width:100%;display:block;}
  .mapbox svg{position:absolute;top:0;left:0;width:100%;height:100%;}
  .nomap{text-align:center;color:#99a;font-size:12px;padding:18px 10px;line-height:1.6;}
  .minibtn{background:#eef2f8;color:#c2456f;border:1px solid #f0c9d8;border-radius:9px;font-size:11px;padding:4px 9px;cursor:pointer;}
  .gmap{display:block; text-align:center; margin:8px 14px 2px; padding:11px; background:linear-gradient(160deg,#5b9bf0,#3f7fe0); color:#fff; border-radius:12px; font-size:14px; font-weight:600; text-decoration:none;}
  .list{padding:8px 14px 30px;}
  .sec{padding:14px 14px 34px;}
  .secintro{font-size:12.5px;color:var(--sub);margin:0 2px 12px;line-height:1.6;}
  .item{display:flex; gap:11px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; align-items:flex-start; box-shadow:0 1px 3px rgba(30,40,80,.04);}
  .pin{min-width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
  .item.done .pin{background:#c2c8d6;}
  .item.done .txt b, .item.done .txt a.name{text-decoration:line-through; opacity:.5;}
  .txt{flex:1; min-width:0;}
  .txt a.name{font-size:14.5px; font-weight:700; color:var(--ink); text-decoration:none; border-bottom:1px dashed #d5b3c1;}
  .txt .d{display:block; font-size:12.5px; color:var(--sub); margin-top:3px; line-height:1.6;}
  .tag{display:inline-block; font-size:10px; padding:1px 7px; border-radius:10px; margin-left:5px; vertical-align:middle; font-weight:600;}
  .t-food{background:#ffe3e3; color:#c0392b;} .t-book{background:#fff1cf; color:#a9780a;} .t-view{background:#d8eef7; color:#1f7fa0;}
  .itembtns{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .check{width:22px; height:22px; border-radius:7px; border:2px solid #cfd5e2; display:flex; align-items:center; justify-content:center; color:transparent; font-size:13px; cursor:pointer;}
  .item.done .check{background:var(--gold); border-color:var(--gold); color:#fff;}
  .trash{font-size:15px;cursor:pointer;opacity:.55;}
  .trash:hover{opacity:1;}
  .spotx{display:block;font-size:11.5px;color:#3f6ea8;margin-top:6px;background:#eef4fc;border:1px solid #dde8f6;border-radius:7px;padding:5px 8px;line-height:1.65;}
  .info{margin-top:6px;background:#f5f7fc;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:12px;}
  .info summary{cursor:pointer;color:#c2456f;padding:6px 0;list-style:none;font-weight:600;}
  .info summary::-webkit-details-marker{display:none;}
  .info .ibody{color:var(--sub);padding:2px 0 8px;line-height:1.7;}
  .info .ibody b{color:#3a3f50;font-weight:700;} .info .ibody .hl{display:block;margin-top:3px;}
  code{background:#eceff7;border:1px solid #dfe4f0;border-radius:5px;padding:1px 5px;font-size:11.5px;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#3f5a86;}
  .additem{margin-top:4px;}
  .addtoggle{text-align:center;padding:11px;border:1px dashed #cdd4e2;border-radius:12px;color:#7d88a0;font-size:13px;cursor:pointer;background:#fbfcfe;}
  .addform{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .addform input{width:100%;margin-bottom:8px;padding:9px;border-radius:8px;border:1px solid #d7dcea;background:#fbfcff;color:var(--ink);font-size:14px;}
  .addbtns{display:flex;gap:8px;}
  .addbtns button{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:linear-gradient(160deg,#ff7a9c,#ffab6b);color:#3a1522;}
  .addbtns button.ghost{background:#eceff6;color:#556;}
  .uitem .pin{background:#5aa0ff;}
  .utag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;font-weight:600;background:#e3f0ff;color:#2c6fc0;}
  .del{color:#e06666;font-size:16px;cursor:pointer;padding:0 4px;}
  .addbtn{flex:0 0 auto;background:linear-gradient(160deg,#ff7a9c,#ffab6b);color:#3a1522;border:none;border-radius:9px;font-size:12px;font-weight:700;padding:6px 9px;cursor:pointer;white-space:nowrap;height:fit-content;}
  .exhead,.cgroup{font-size:15px; margin:16px 4px 8px; padding:0 4px; font-weight:700;}
  .excard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:2px 14px; margin-bottom:12px;}
  .exrow{padding:11px 0; border-top:1px solid var(--line);} .exrow:first-child{border-top:none;}
  .exrow b{font-size:14px;} .exrow .where{font-size:11px; color:var(--gold); margin-left:6px;}
  .exrow .why{display:block; font-size:12.5px; color:var(--sub); margin-top:2px;}
  .hotel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:11px;box-shadow:0 1px 3px rgba(30,40,80,.04);}
  .hotel h4{margin:0 0 3px;font-size:15px;}
  .hotel .hmeta{font-size:11.5px;color:#3f6ea8;margin-bottom:6px;}
  .hotel .hprice{font-size:13px;color:#c2456f;font-weight:700;margin-bottom:5px;}
  .hotel .hrow{font-size:12.5px;color:var(--sub);line-height:1.7;} .hotel .hrow b{color:#3a3f50;}
  .pick{background:#fff6e6;border:1px solid #f0d9a8;border-radius:12px;padding:11px 13px;font-size:13px;color:#8a5a00;margin-bottom:12px;line-height:1.6;}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px;}
  .tcard h4{margin:0 0 4px;font-size:14px;} .tcard .tp{font-size:12.5px;color:var(--sub);line-height:1.7;}
  .troute{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;} .troute:first-child{border-top:none;}
  .troute .tr-l{flex:1;color:var(--ink);} .troute .tr-r{color:#3f6ea8;white-space:nowrap;text-align:right;}
  .tiplist{padding-left:18px;margin:6px 0 0;} .tiplist li{font-size:12.5px;color:var(--sub);margin-bottom:6px;line-height:1.6;}
  .citem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;}
  .citem .cname{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1px dashed #d5b3c1;}
  .citem .cintro{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.6;}
  .citem .cfit{font-size:11.5px;color:#c2456f;margin-top:4px;} .citem .carea{color:var(--gold);}
  .drawer{position:fixed;top:0;right:-270px;width:250px;height:100%;background:#fff;box-shadow:-4px 0 18px rgba(0,0,0,.13);z-index:60;transition:right .22s;padding:14px;}
  .drawer.open{right:0;}
  .drawerhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:12px;color:#3a2230;}
  .dclose{cursor:pointer;color:#aaa;font-size:17px;}
  .drawer button{display:block;width:100%;text-align:left;padding:13px 12px;margin-bottom:9px;border:1px solid var(--line);border-radius:11px;background:#faf7fb;color:var(--ink);font-size:14.5px;cursor:pointer;}
  .scrim{position:fixed;inset:0;background:rgba(20,20,40,.28);z-index:55;opacity:0;pointer-events:none;transition:.22s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .mapattr{font-size:9.5px;color:#a6adbd;text-align:right;margin:3px 4px 0;}
  .offpin{color:#9aa3b5;font-size:11px;}
  .warn{background:#fff4f4;border:1px solid #f3d2d2;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#a24545;margin-bottom:12px;line-height:1.7;}
  .warn b{color:#8c2f2f;}
  .todo{background:#f2f7ff;border:1px dashed #b9cdea;border-radius:12px;padding:12px 13px;font-size:12.5px;color:#3f6ea8;line-height:1.7;margin-bottom:12px;}
  .todo b{color:#2c5a90;}
  .chk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin-bottom:12px;}
  .chkrow{padding:11px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;} .chkrow:first-child{border-top:none;}
  .chkrow b{font-size:13px;color:#3a3f50;} .chkrow .when{display:block;color:#c2456f;font-size:11.5px;margin-top:3px;margin-bottom:4px;font-weight:700;}
  .alertbox{margin:0 0 14px;background:linear-gradient(160deg,#fff0f4,#fff7ea);border:1.5px solid #f0aec2;border-radius:14px;padding:13px 14px;box-shadow:0 2px 8px rgba(200,60,110,.08);}
  .alertbox h3{margin:0 0 3px;font-size:15.5px;color:#b3245a;}
  .alertbox .asub{font-size:11.5px;color:#a06a80;margin-bottom:6px;}
  .alertrow{padding:10px 0;border-top:1px dashed #f2c4d3;font-size:12.5px;line-height:1.65;color:#5a4550;}
  .alertrow:first-of-type{border-top:none;}
  .alertrow b{color:#b3245a;}
  .dl{display:inline-block;background:#c2456f;color:#fff;border-radius:8px;font-size:11px;padding:2px 8px;margin-right:6px;font-weight:700;letter-spacing:.2px;}
  .dl.g{background:#3f7fe0;}
  .paceline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 13px;margin-bottom:12px;}
  .pacerow{padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.6;} .pacerow:first-child{border-top:none;}
  .pacerow b{color:#3a3f50;}
</style>

<script>

const TRANSIT = {"cards":[{"name":"Suica / PASMO（含手機版）","price":"實體卡押金約 ¥500（可退）；手機版免押金，綁信用卡儲值","advice":"15 天天天搭電車必備，嗶進嗶出免買票，JR、地鐵、私鐵、公車通用。3 人各開一張手機 Suica 最方便，先儲 ¥3,000–5,000，用完再加值。便利商店、自動販賣機也能刷。"},{"name":"Tokyo Subway Ticket（24／48／72 小時）","price":"約 ¥1,000 / ¥1,500 / ¥2,000","advice":"只吃「東京 Metro＋都營地鐵」吃到飽，不含 JR 與私鐵。**但你們住在 JR 總武線各停上**，最常用的是 JR（秋葉原、御茶之水、新宿、中野、三鷹都是直達）→ 整體不划算，Suica 逐段付通常更省。"},{"name":"JR Pass（全國版）","price":"7 日券約 ¥50,000","advice":"15 天都在東京不要買，純市區完全回不了本。連富士山那天也用不到——高速巴士不吃 JR Pass。"},{"name":"東京迪士尼度假區線（單軌）","price":"單程 大人 ¥300／1 日券 大人 ¥700","advice":"只有去「迪士尼海洋」才需要（樂園從舞濱站走 5 分就到）。只搭來回的話買兩張單程 ¥600 比 1 日券便宜。"}],"airport":[{"route":"成田 → **淺草橋站**（京成本線・都營淺草線直通・不用轉車）","time":"約 80–90 分","cost":"約 ¥1,300（最輕鬆，行李不用扛上下樓）"},{"route":"成田 → 京成上野（京成 Skyliner 直達）→ 轉車到飯店","time":"約 45 分＋轉車 15 分","cost":"約 ¥2,570（線上先訂較便宜）"},{"route":"成田 → 上野（京成本線 特急，慢但便宜）","time":"約 70–80 分","cost":"約 ¥1,060"},{"route":"羽田 → **淺草橋站**（京急・都營淺草線直通・不用轉車）","time":"約 45 分","cost":"約 ¥600"},{"route":"成田／羽田 → 上野（利木津巴士）","time":"成田約 90–120 分、羽田約 50–80 分","cost":"約 ¥3,600／¥1,400（帶大行李最輕鬆，會塞車）"}],"perDay":[{"day":1,"area":"抵達・上野","how":"機場 →（京成／京急・都營淺草線直通）→ **淺草橋站** → 走 7 分到飯店。之後阿美橫町用走的（約 10 分）或搭一站。"},{"day":2,"area":"上野公園・博物館","how":"走路約 20 分；或 新御徒町 →(都營大江戶線 1 站)→ 上野御徒町 再走 8 分。館與館之間全部用走的。"},{"day":3,"area":"谷根千","how":"淺草橋 →(JR 總武線各停)→ 秋葉原 →(京濱東北線)→ 日暮里，約 15 分 約 ¥180。之後谷中→根津一路走回來，全程可步行。"},{"day":4,"area":"淺草","how":"藏前 →(都營淺草線 1 站)→ 淺草，約 2 分 ¥180；**或沿隅田川走路約 20 分**，天氣好很舒服。晴空塔從淺草搭東武 1 站 3 分 ¥150（也可以走路 20 分過隅田川）。"},{"day":5,"area":"秋葉原・御茶之水","how":"淺草橋 →(JR 總武線各停 **1 站**)→ 秋葉原，約 3 分 ¥150。秋葉原走到御茶之水約 10 分，或搭總武線 1 站。**這是全程最近的一天。**"},{"day":6,"area":"中野・高圓寺","how":"淺草橋 →(JR 總武線各停 **直達**)→ 中野，約 25 分 約 ¥240；中野 →(1 站)→ 高円寺，2 分 ¥150。不用轉車。"},{"day":7,"area":"迪士尼","how":"淺草橋 →(總武線各停)→ 秋葉原 →(山手／京濱東北線)→ 東京站 →(站內走 15–20 分)→ 京葉線 → 舞濱，約 40 分 約 ¥400。**怕走遠路**可改：藏前 →(都營大江戶線)→ 月島 →(有樂町線)→ 新木場 →(京葉線 1 站)→ 舞濱。"},{"day":8,"area":"池袋","how":"淺草橋 →(總武線各停)→ 秋葉原 →(JR 山手線 內回)→ 池袋，約 30 分 約 ¥230。池袋東口與東池袋之間走路即可。"},{"day":9,"area":"富士山・河口湖","how":"見下方「🗻 富士山當天來回」專區。**05:45 出門，搭東京站 06:20 的巴士。**"},{"day":10,"area":"三鷹・吉祥寺","how":"淺草橋 →(總武線各停)→ **御茶之水** →(JR 中央線快速／中央特快)→ 三鷹，約 35 分 約 ¥400（轉 1 次）。三鷹站南口 → 吉卜力循環巴士 5 分 ¥230，或走 15 分。回程從吉祥寺搭中央線快速。"},{"day":11,"area":"新宿","how":"淺草橋 →(JR 總武線各停 **直達**)→ 新宿，約 20 分 約 ¥210。不用轉車。新宿站內超大，記住「東口＝購物、南口＝拉麵、西口＝都廳」。"},{"day":12,"area":"原宿・表參道","how":"淺草橋 →(總武線各停)→ 代代木 →(JR 山手線 1 站)→ 原宿，約 25 分 約 ¥210。原宿走到表參道約 10 分，或 Metro 千代田線 1 站。"},{"day":13,"area":"澀谷","how":"淺草橋 →(總武線各停)→ 代代木 →(山手線)→ 澀谷，約 30 分 約 ¥210；或 淺草橋 →(都營淺草線)→ 東銀座 →(銀座線 直達)→ 澀谷，轉一次、有位子坐的機率高。"},{"day":14,"area":"寶可夢樂園（讀賣樂園）","how":"淺草橋 →(JR 總武線各停 **直達**)→ 新宿 →(京王線)→ **京王よみうりランド**，約 55 分 約 ¥570。再搭纜車「スカイシャトル」單程 ¥300／來回 ¥500、約 10 分（**纜車不含在任何通票裡**）。或站前搭小田急巴士「読01」約 5 分 ¥250。"},{"day":15,"area":"回程","how":"見 D15 那天的說明。**⚠️ 回程從成田還是羽田出發會決定這天怎麼排。**"}],"tips":["**住的地方在 JR 總武線各停上**，這條線直達秋葉原、御茶之水、新宿、中野、三鷹——你們大半天數不用轉車，這是這個住宿最大的優點。","**都營淺草線也在走路範圍**（淺草橋・藏前），直達淺草、東銀座，還能直通機場（成田・羽田都行）。","尖峰別擠：平日早上 7:30–9:00、傍晚 17:30–19:00 超擠，帶戰利品更要避開。","進出站都要嗶：進站嗶、出站再嗶扣款，餘額不足到加值機補（機器有中文）。","路線用 Google 地圖或 Yahoo 乗換案內查：會給你月台、第幾節車廂、轉乘、票價與時間。","注意末班車：東京電車約凌晨 0:00–0:30 收班，玩晚先查，錯過只能搭貴很多的計程車。","跟路線代號走：每條線有顏色＋字母數字（總武線各停 JB、山手線 JY、都營淺草線 A），看代號比看漢字快。","JR 車資 2026/3/14 已全面調漲約 7%，網路上舊攻略的票價要自己加一點。"],"special":[{"h":"🗻 富士山當天來回（D9・2/17 週三・平日）","body":"<b>結論：住淺草橋最順的走法是「JR 20 分到東京站 → 高速巴士直達河口湖」。而且要搭最早那幾班。</b><br><br>⏰ <b>2 月的富士山清晨到上午 9 點前最清楚</b>，過中午常常整座山被雲吃掉 → 這天唯一的策略就是<b>越早到越好</b>。<br>👉 <b>05:45 出門，搭東京站 06:20 那班，08:22 到河口湖。</b>最晚不要晚於 06:50 那班。<br><br><b>① 飯店 → 東京站</b>：淺草橋 →(JR 總武線各停 1 站)→ 秋葉原 →(京濱東北線 2 站)→ 東京，約 20 分 約 ¥170。<br><b>② 東京站八重洲南口 → 河口湖</b>：高速巴士 <b>¥2,300</b>（網路購票 ¥2,250），約 2 小時。<br><b>去程班次</b>：<b>06:20</b> / 06:50 / 07:20 / 07:40 / 08:10 / 08:40 / 09:20 / 09:50 / 10:20…<br><b>回程班次</b>（河口湖站發）：…15:00 / 15:30 / 16:00 / 16:30 / <b>17:00</b> / 17:30 / 18:00 / 19:00 / 19:30（末班）。<b>建議搭 17:00，約 19:15 到東京站、19:40 回飯店。</b><br><br>⚠️ <b>全車座席指定制，必須事先購票</b> —— 乘車日 1 個月前的前 1 日 10:00 開賣（2/17 的票約 <b>2027/1/16 10:00</b> 開搶），去程回程一起訂掉。<br>🎟 訂票：高速巴士網 <code>https://www.kousokubus.net/</code>／發車 OK 網／超商／JR 巴士東京站窗口。<br><br>🚄 <b>替代方案</b>：JR 特急「富士回遊」新宿 → 河口湖 ¥4,200、約 1 小時 53 分、全車指定席。淺草橋搭總武線各停直達新宿只要 20 分，所以這條也很順 —— 但<b>平日班次少、票價貴一倍</b>，而且 2027/2 的平日時刻<b>需再確認</b>。<br>🚃 <b>不想預約的方案</b>：普通電車 淺草橋 →(總武線各停)→ 新宿 →(中央線)→ 高尾 → 大月 →(富士急行線)→ 河口湖，約 3 小時、不用預約、可以臨時決定幾點走。慢一點但完全彈性。<br>❄️ 中央道富士吉田線冬季有冬用輪胎規制，下雪日巴士可能誤點或停駛 → <b>氣象預報有雪就改搭電車比較保險</b>。<br><br><b>③ 到了河口湖：周遊巴士（レトロバス）1 Day Pass ¥1,500</b>（兒童 ¥750），紅・綠・藍・P 線全通用。<br>・紅線（河口湖線）9:00–17:45、<b>每 15 分一班</b>，繞北岸 20 站 ← 主力<br>・綠線（西湖線）9:10 起每 30 分一班，末班約 16:40<br>・藍線（鳴澤・精進湖・本栖湖線）一天只有幾班，很難排<br><br>❌ <b>這次不看冬花火。</b>冬花火只有週六日晚上 20:00–20:20，平日沒有 —— 這也是為什麼可以排平日、當天來回、不用在河口湖過夜。<br>❌ <b>「河口湖 音樂與森林美術館」原則週二・週三公休</b>，2/17 是週三 → <b>去不了，已從行程移除</b>。想去美術館就改去久保田一竹美術館（週二休，2/17 有開）。<br><br>🌤 <b>2 月看得到富士山的機率大約五到六成</b>（有能見度統計網站列 2 月 55–60%，<b>單一來源、需再確認</b>），最佳時段是清晨到上午 9 點前。<br>💰 每人約 ¥8,000（不含餐費）。🧥 河口湖 2 月：平均 0.6°C、日最高 6.6°C、<b>日最低 −4.8°C</b>、月降雪 28cm —— 三層式穿法＋圍巾耳罩手套毛帽暖暖包。<br>🧊 <b>建議帶一副輕便冰爪</b>（約 ¥1,000–2,000）：忠靈塔 398 階、湖畔步道、天上山展望台這三處結冰風險最高。<br><br><i>資料查證日 2026-08-24。<b>2027 年 2 月的時刻表全部尚未公布</b>，出發前 1 個月務必重查。</i>"},{"h":"🛍 回程日 outlet（D15・2/23）—— ⚠️ 先確認回程機場","body":"🚨 <b>母檔（v6）裡沒有回程航班資訊，所以「從成田還是羽田出發」目前是空的 —— 這件事會決定這天怎麼排。</b><br><br><b>✅ 如果從成田出發</b>：酒酒井 outlet 的安排完全成立。<br>・東京站（バスターミナル東京八重洲 地下 A・A02）→ outlet：直達高速巴士 <b>約 50 分・大人 ¥1,300</b>，發車 8:40／9:20／9:40／<b>10:20</b>／10:40／11:40／12:30／13:20／14:10／15:10（2026/3/20 現在）<br>・outlet → 成田機場：直達巴士 <b>15 分・大人 ¥500</b>，第 2 航廈 +18 分、第 1 航廈 +23 分。發車 11:15／12:30／13:20／14:15／15:15／15:45／<b>16:15／16:45</b>／<b>17:40</b>／18:40（末班）<br>・⚠️ <b>兩段巴士都不可預約、先到先上</b>，2/23 是天皇誕生日國定假日，滿車就等下一班（30–60 分一班）→ 提早排隊。<br><br><b>❌ 如果從羽田出發</b>：<b>酒酒井完全不順路。</b>官方交通頁沒有羽田的直達方式，要轉 2 次車、含等車約 <b>2～2.5 小時</b>，扛著行李這樣跑很危險。<br><b>🔁 三個替代方案（她自己選，不要偷改）</b>：<br><b>A.</b> 另外排<b>獨立一天</b>去酒酒井（推薦）—— 東京站直達巴士 50 分、輕裝去、時間自由，可塞進 D3 或 D6 這種彈性日。<br><b>B.</b> 換成<b>御殿場</b> Premium Outlets —— 店更多（約 290 家）、也有 Polo Ralph Lauren（還多一家童裝專門店）。<b>但御殿場離羽田同樣遠甚至更遠</b>（轉乘 3 小時以上），一樣只能排獨立一天，不能當回程順路。<br><b>C.</b> 回程當天改在市區逛（銀座／新宿／台場），逛完直接去羽田。<br><br>🧳 <b>   h+='<div class="daychips">'+paceChip(day.pace);
  if(day.walk) h+='<span class="chip">🚶 '+day.walk+'</span>';
  if(day.move) h+='<span class="chip">🚉 '+day.move+'</span>';
  if(day.book) h+='<span class="chip'+(day.book.indexOf('不用')<0?' bk':'')+'">🎫 '+day.book+'</span>';
  h+='</div><div class="d-hotel">🏨 住：'+HOTEL+'｜14 晚不搬</div></div>';
  if(day.flex) h+='<div class="flexbar">😴 <b>彈性日</b>——可以睡到自然醒，任何一站不想去就直接 🗑 刪掉，不會影響其他天。</div>';
  if(day.note) h+='<div class="daynote">'+md(day.note)+'</div>';
  h+='<div class="mapwrap"><div class="maptitle"><span>📍 當天路線（號碼＝順序，一站接一站）</span><button class="minibtn" onclick="toggleOpt('+day.n+')">'+(optDays[day.n]?'↩︎ 原順序':'🧭 排最短')+'</button></div>'+buildMap(day,order,numberOf)+'</div>';
  const dl=gmapDayLink(day,order); if(dl) h+='<a class="gmap" href="'+dl+'" target="_blank" rel="noopener">🗺️ 用 Google 地圖導航這天</a>';
  h+='<div class="list">';
  order.forEach((oi,pos)=> h+=itemHTML(day,oi,numberOf[oi],transitLine(day,order,pos)));
  (userItems[day.n]||[]).forEach((u,ui)=> h+=userItemHTML(day.n,ui,u,order.length+ui+1));
  h+=addFormHTML(day.n)+'</div>'; contentEl.innerHTML=h;
}
function alertHTML(){
  let s='<div class="alertbox"><h3>🚨 搶票倒數（照時間排，錯過就沒了）</h3><div class="asub">資料查證日 2026-08-24・出發前請再確認官網</div>';
  ALERTS.forEach(a=>{ s+='<div class="alertrow"><span class="dl'+(a.g?' g':'')+'">'+a.when+'</span><b>'+a.t+'</b><br>'+md(a.d)+'</div>'; });
  s+='</div>'; return s;
}
function renderOverview(){
  const o=OVERVIEW;
  let s='<div class="sec">'+alertHTML();
  s+='<div class="secintro">🗾 15 天分區總覽——號碼＝那天主要待的區域。點下面日子看細節、右上 ☰ 看交通／住宿／候選。</div>';
  s+='<div class="mapbox" style="margin-bottom:4px;"><img src="'+o.img+'" alt="overview"><svg viewBox="0 0 '+o.w+' '+o.h+'" preserveAspectRatio="none">';
  o.pins.forEach(p=>{ s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="15" fill="#e35b8b" stroke="#fff" stroke-width="2.5"/><text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">'+p.n+'</text>'; });
  s+='</svg></div><div class="mapattr" style="margin-bottom:10px">地圖 © OpenStreetMap contributors</div><div class="excard" style="padding:2px 14px">';
  o.legend.forEach(l=>{ const ic=l.pace==='輕鬆'?'🟢':(l.pace==='硬仗'?'🔴':'🟡');
    s+='<div class="troute"><span class="tr-l">'+ic+' <b>D'+l.d+'</b>　'+l.date+'（'+l.dow+'）　'+l.area+(l.flex?' <span class="offpin">·彈性日</span>':'')+(l.off?' <span class="offpin">·地圖外</span>':'')+'</span><span class="tr-r" onclick="select('+(l.d-1)+')" style="color:#c2456f;cursor:pointer">看這天 ›</span></div>'; });
  s+='</div>';
  s+='<div class="cgroup">⚖️ 15 天的節奏是這樣安排的</div><div class="daynote" style="margin:0 0 12px">'+md(PACENOTE)+'</div>';
  s+='</div>'; contentEl.innerHTML=s;
}
function hotelCard(o){ const q=encodeURIComponent(o.name+' 東京');
  return '<div class="hotel"><h4><a class="cname" style="text-decoration:none;color:inherit;border-bottom:1px dashed #d5b3c1" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+o.name+'</a></h4><div class="hmeta">📍 '+md(o.area||'')+'｜🚶 '+md(o.walk||'')+'</div><div class="hprice">💰 '+md(o.price||'')+'</div><div class="hrow"><b>房型</b>：'+md(o.room||'')+'<br><b>優點</b>：'+md(o.pros||'')+'<br><b>缺點</b>：'+md(o.cons||'')+(o.good_for?'<br><b>適合</b>：'+md(o.good_for):'')+'</div></div>'; }
function renderHotels(){
  let h='<div class="sec"><div class="secintro">'+md(HOTELS.intro)+'</div>';
  h+='<div class="cgroup">🏨 已定案（全程住這裡）</div>'; HOTELS.list.forEach(o=>h+=hotelCard(o));
  if(HOTELS.pick) h+='<div class="pick">⭐ '+md(HOTELS.pick)+'</div>';
  if(HOTELS.note) h+='<div class="warn">'+md(HOTELS.note)+'</div>';
  h+=renderSecUser('ho')+secAddHTML('ho')+'</div>'; contentEl.innerHTML=h;
}
function renderBooking(){
  let h='<div class="sec">'+alertHTML()+'<div class="secintro">'+md(BOOKING.intro)+'</div><div class="chk">';
  BOOKING.rows.forEach(r=>{ h+='<div class="chkrow"><b>'+r.t+'</b><span class="when">'+md(r.when)+'</span>'+md(r.d)+'</div>'; });
  h+='</div>'+renderSecUser('bk')+secAddHTML('bk')+'</div>'; contentEl.innerHTML=h;
}
function renderTransit(){
  let h='<div class="sec"><div class="secintro">你們沒車、全靠電車。票卡、機場往返、每天怎麼從飯店出發，都在這裡。</div>';
  h+='<div class="cgroup">🎫 票卡</div>'; TRANSIT.cards.forEach(c=>h+='<div class="tcard"><h4>'+c.name+'</h4><div class="tp"><b>'+md(c.price)+'</b><br>'+md(c.advice)+'</div></div>');
  h+='<div class="cgroup">✈️ 機場 ↔ 飯店</div><div class="excard" style="padding:2px 14px">'; TRANSIT.airport.forEach(a=>h+='<div class="troute"><span class="tr-l">'+md(a.route)+'</span><span class="tr-r">'+a.time+'<br>'+md(a.cost)+'</span></div>'); h+='</div>';
  (TRANSIT.special||[]).forEach(s=>{ h+='<div class="cgroup">'+s.h+'</div><div class="tcard"><div class="tp">'+s.body+'</div></div>'; });
  h+='<div class="cgroup">🚃 每天從飯店怎麼走</div><div class="excard" style="padding:2px 14px">';
  TRANSIT.perDay.forEach(p=>h+='<div class="troute"><span class="tr-l"><b>D'+p.day+'</b>　'+p.area+'<span class="why" style="display:block;font-size:12px;color:#6f7890;margin-top:3px;line-height:1.6">'+md(p.how)+'</span></span></div>'); h+='</div>';
  h+='<div class="cgroup">💡 小撇步</div><ul class="tiplist">'; TRANSIT.tips.forEach(t=>h+='<li>'+md(t)+'</li>'); h+='</ul>';
  h+=renderSecUser('tr')+secAddHTML('tr')+'</div>'; contentEl.innerHTML=h;
}
function renderExtras(){
  let h='<div class="sec"><div class="secintro">精選店家，右邊 ➕ 直接加到系統猜的那一天（加錯了到那天刪掉再自己加就好）。</div>';
  EXTRAS.forEach(sec=>{ h+='<div class="exhead">'+sec.h+'</div><div class="excard">';
    sec.rows.forEach(r=>{ const q=encodeURIComponent(r[0]+' 東京'); const dn=area2day(r[1]+r[0]); const nm=r[0].replace(/'/g,'');
      h+='<div class="exrow"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1"><b><a class="name" style="border:none;color:#c2456f" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+r[0]+'</a></b><span class="where">'+r[1]+'</span><span class="why">'+md(r[2])+'</span></div><button class="addbtn" onclick="addToDay('+dn+',\''+nm+'\',\''+r[1]+'\')">＋D'+dn+'</button></div></div>'; });
    h+='</div>'; });
  h+=renderSecUser('ex')+secAddHTML('ex')+'</div>'; contentEl.innerHTML=h;
}
function renderCands(){
  const groups=[['see','👀 想看／想去'],['buy','🛍 想買／挖寶'],['eat','🍰 想吃／喝']];
  let h='<div class="sec"><div class="secintro">沒排進 15 天、但值得知道的加碼。彈性日想加東西就從這裡挑，右邊 ➕ 加進去。</div>';
  groups.forEach(g=>{ if((CANDS[g[0]]||[]).length) h+='<div class="cgroup">'+g[1]+'</div>';
    (CANDS[g[0]]||[]).forEach(c=>{ const q=encodeURIComponent(c.name+' 東京'); const dn=area2day((c.fit||'')+' '+(c.area||'')); const nm=c.name.replace(/'/g,'');
      h+='<div class="citem"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="flex:1"><a class="cname" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+c.name+'</a><div class="cintro">'+md(c.intro)+'</div><div class="cfit"><span class="carea">📍 '+c.area+'</span>　'+md(c.fit||'')+'</div></div><button class="addbtn" onclick="addToDay('+dn+',\''+nm+'\',\''+(c.area||'')+'\')">＋D'+dn+'</button></div></div>'; });
  });
  h+=renderSecUser('cd')+secAddHTML('cd')+'</div>'; contentEl.innerHTML=h;
}
function secAddHTML(sec){
  return '<div class="additem"><div class="addtoggle" onclick="showSecAdd(\''+sec+'\')">＋ 自己新增想去的</div><div class="addform" id="secform-'+sec+'" style="display:none"><input id="sc-name-'+sec+'" placeholder="名稱（必填）"><input id="sc-note-'+sec+'" placeholder="備註／地址（可不填）"><div class="addbtns"><button onclick="addSec(\''+sec+'\')">加進去</button><button class="ghost" onclick="hideSecAdd(\''+sec+'\')">取消</button></div></div></div>';
}
function renderSecUser(sec){
  const arr=secItems[sec]||[]; let h='';
  if(arr.length){ h+='<div class="cgroup">📌 我自己加的</div>';
    arr.forEach((u,i)=>{ const q=encodeURIComponent(u.t+' 東京');
      h+='<div class="citem"><a class="cname" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+esc(u.t)+'</a>'+(u.d?'<div class="cintro">'+esc(u.d)+'</div>':'')+'<div class="cfit"><span onclick="delSec(\''+sec+'\','+i+')" style="color:#e06666;cursor:pointer">✕ 刪除</span></div></div>'; }); }
  return h;
}
function toggle(id){ done[id]=!done[id]; save(KEY,done); renderDay(); }
function toggleOpt(n){ optDays[n]=!optDays[n]; save(OKEY,optDays); renderDay(); }
function confirmDel(n,oi){ const day=DAYS.find(d=>d.n===n); const nm=day.items[oi].t; if(confirm('確定要刪除「'+nm+'」嗎？')){ delItems['d'+n+'_'+oi]=true; save(DKEY,delItems); renderDay(); } }
function addUserItem(n){
  const name=(document.getElementById('ai-name-'+n).value||'').trim(); if(!name){ alert('幫這個點取個名字吧 🙂'); return; }
  const note=(document.getElementById('ai-note-'+n).value||'').trim();
  const llraw=(document.getElementById('ai-ll-'+n).value||'').trim();
  let ll=null; const mm=llraw.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/); if(mm) ll=[parseFloat(mm[1]),parseFloat(mm[2])];
  if(!userItems[n]) userItems[n]=[]; userItems[n].push({t:name,d:note,ll:ll,done:false});
  save(UKEY,userItems); renderDay();
}
function toggleUser(n,ui){ userItems[n][ui].done=!userItems[n][ui].done; save(UKEY,userItems); renderDay(); }
function delUser(n,ui){ userItems[n].splice(ui,1); save(UKEY,userItems); renderDay(); }
function showAdd(n){ const f=document.getElementById('addform-'+n); if(f) f.style.display='block'; }
function hideAdd(n){ const f=document.getElementById('addform-'+n); if(f) f.style.display='none'; }
function addToDay(dn,name,note){ if(!userItems[dn]) userItems[dn]=[]; userItems[dn].push({t:name,d:note||'',ll:null,done:false}); save(UKEY,userItems); alert('已加到 D'+dn+'（去那天行程最下面看，可再自己搬／刪）'); }
function addSec(sec){ const n=(document.getElementById('sc-name-'+sec).value||'').trim(); if(!n){alert('取個名字吧 🙂');return;} const d=(document.getElementById('sc-note-'+sec).value||'').trim(); if(!secItems[sec])secItems[sec]=[]; secItems[sec].push({t:n,d:d}); save(SKEY,secItems); rerenderSec(sec); }
function delSec(sec,i){ secItems[sec].splice(i,1); save(SKEY,secItems); rerenderSec(sec); }
function showSecAdd(sec){const f=document.getElementById('secform-'+sec);if(f)f.style.display='block';}
function hideSecAdd(sec){const f=document.getElementById('secform-'+sec);if(f)f.style.display='none';}
function rerenderSec(sec){ if(sec==='bk')renderBooking(); else if(sec==='tr')renderTransit(); else if(sec==='ho')renderHotels(); else if(sec==='ex')renderExtras(); else if(sec==='cd')renderCands(); }
function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
function nav(s){ closeDrawer(); select(s); }
function select(i){
  tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.i==i));
  if(i==='ov'){ renderOverview(); } else if(i==='bk'){ renderBooking(); } else if(i==='tr'){ renderTransit(); } else if(i==='ho'){ renderHotels(); } else if(i==='ex'){ renderExtras(); } else if(i==='cd'){ renderCands(); }
  else { cur=parseInt(i,10); renderDay(); }
  window.scrollTo({top:0,behavior:'smooth'});
}
let th='<div class="tab" data-i="ov"><b>🗾</b>總覽</div>';
DAYS.forEach((d,i)=>{ th+='<div class="tab" data-i="'+i+'"><b>D'+d.n+'</b>'+d.date+'</div>'; });
tabsEl.innerHTML=th;
tabsEl.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>select(t.dataset.i); });
select('ov');

</script>
</body>
</html>
